<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Project Proposal System ? Board</title>
<style>
:root{--bg:#0d0d0f;--dot:#26262b;--node:#1a1a1e;--node-b:#2e2e35;--txt:#f4f4f5;--mut:#8b8b94;--or:#FF4900;--or-soft:rgba(255,73,0,.08);--line:#4a4a52}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:24px 24px}
#stage.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#world.anim{transition:transform .45s cubic-bezier(.2,.8,.2,1)}
svg#wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.frame{position:absolute;border:1.5px dashed #3a3a42;border-radius:22px}
.frame.or{border-color:rgba(255,73,0,.55);background:var(--or-soft)}
.frame .fl{position:absolute;top:-13px;left:22px;background:var(--bg);padding:2px 10px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);border-radius:6px}
.frame.or .fl{color:var(--or)}
.col-l{position:absolute;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--or);opacity:.85}
.n{position:absolute;display:flex;align-items:center;gap:10px;padding:0 16px;border-radius:14px;background:var(--node);border:1.5px solid var(--node-b);font-size:16px;font-weight:650;line-height:1.15;cursor:pointer;user-select:none;transition:border-color .15s,transform .15s}
.n:hover{border-color:#5a5a64}
.n .i{font-size:11px;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums;flex-shrink:0}
.n.or{background:var(--or);border-color:var(--or);color:#fff}
.n.or .i{color:rgba(255,255,255,.75)}
.n.or:hover{border-color:#fff}
.n.big{font-size:20px;font-weight:800}
.n.pitched{border-style:dashed;background:transparent}
.n.ghost{background:transparent;border-color:#2a2a30;color:var(--mut);cursor:default;font-weight:550;font-size:15px}
.n.ghost:hover{border-color:#2a2a30}
.n.sel{outline:3px solid #fff;outline-offset:3px}
.n.dim{opacity:.25}
.el{position:absolute;font-size:11px;font-weight:600;color:var(--mut);white-space:nowrap;background:var(--bg);padding:1px 6px;border-radius:4px}
/* HUD */
.hud{position:fixed;z-index:20;display:flex;gap:6px}
.hud.top{top:max(12px,env(safe-area-inset-top));left:12px;right:12px;justify-content:space-between;pointer-events:none}
.hud.top>*{pointer-events:auto}
.title{background:rgba(20,20,24,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #2a2a30;border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:10px}
.title .dot{width:9px;height:9px;border-radius:3px;background:var(--or)}
.key{display:flex;gap:10px;font-size:11px;color:var(--mut);font-weight:600}
.key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.chips{bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:rgba(20,20,24,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #2a2a30;border-radius:14px;padding:5px;max-width:calc(100vw - 24px);overflow-x:auto}
.chips button,.zoom button{border:0;background:transparent;color:var(--txt);font:600 13px/1 inherit;font-family:inherit;padding:9px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}
.chips button:hover,.zoom button:hover{background:#2a2a30}
.chips button.on{background:var(--or);color:#fff}
.zoom{flex-direction:column;right:12px;bottom:84px;background:rgba(20,20,24,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #2a2a30;border-radius:12px;padding:4px}
.zoom button{font-size:18px;width:40px;height:40px;padding:0}
/* Sheet */
.sheet{position:fixed;z-index:30;right:12px;top:12px;bottom:12px;width:min(400px,calc(100vw - 24px));background:#141417;border:1px solid #2e2e35;border-radius:20px;display:flex;flex-direction:column;transform:translateX(calc(100% + 24px));transition:transform .3s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.sheet.on{transform:none}
.sh-h{padding:18px 18px 14px;display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid #24242a}
.sh-h .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.sh-h .k.or{color:var(--or)}
.sh-h h3{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.x{margin-left:auto;flex-shrink:0;width:34px;height:34px;border-radius:50%;border:0;background:#24242a;color:#fff;font-size:18px;cursor:pointer}
.sh-b{overflow-y:auto;padding:6px 18px 18px;-webkit-overflow-scrolling:touch}
.sec{padding:12px 0;border-bottom:1px solid #222227}
.sec:last-child{border-bottom:0}
.sec .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.sec p,.sec li{font-size:14.5px;line-height:1.45;color:#d6d6db}
.sec ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.sec li{padding-left:14px;position:relative}
.sec li:before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:2px;background:#55555e}
.sec.ok .k{color:#2fd27a}.sec.ok li:before{background:#2fd27a}
.sec.bad .k{color:#ff4d6d}.sec.bad li:before{background:#ff4d6d}
.io{display:flex;gap:8px;align-items:stretch}
.io div{flex:1;background:#1c1c21;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.4;color:#d6d6db}
.io b{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:3px}
.sh-f{display:flex;justify-content:space-between;padding:10px 12px;border-top:1px solid #24242a}
.sh-f button{border:0;background:#24242a;color:#fff;font:600 13px inherit;font-family:inherit;padding:10px 14px;border-radius:10px;cursor:pointer}
.sh-f button:disabled{opacity:.3}
@media (max-width:700px){
  .key{display:none}
  .sheet{left:0;right:0;top:auto;bottom:0;width:100%;height:72vh;border-radius:20px 20px 0 0;transform:translateY(100%)}
  .sheet.on{transform:none}
  .zoom{bottom:auto;top:64px}
}
</style>
</head>

<marker id="aho" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF4900"/></marker>

</aside>

  ok:['Speaks to the labor pressure the firm actually faces'],bad:['Assigned without real hiring signals']},
 {id:'n4',t:'Sales and Bids',s:'Win more work using this project as proof.',path:'Project showcase assets',
  purpose:'For trades and contractors who compete on bids.',
  does:['Proposal shows their work as a showcase for future bids','Leads to project showcase assets'],inp:'Trade or competitive-bid company type.',out:'Sales pitch.',
  ok:['Ties the visuals directly to winning the next job'],bad:['Focus is on the building, not their scope of work']},
 {id:'n5',t:'Investor and Owner Updates',s:'Report progress to people funding the project.',path:'Progress reporting',
  purpose:'For owners and developers with investors and stakeholders to update.',
  does:['Proposal shows regular progress visuals','Leads into progress reporting and tracking'],inp:'Owner or developer role.',out:'Updates pitch.',
  ok:['Connects to the progress tracking vision'],bad:['Pitched to a party with no one to report to']},
 {id:'n6',t:'Community and PR',s:'Keep the public and community on side.',path:'Public-facing content',
  purpose:'For public projects and high-visibility developments.',
  does:['Proposal shows public-facing visuals and updates','Leads to community and PR content'],inp:'Public project or high-visibility development.',out:'PR pitch.',
  ok:['Fits projects with real public attention'],bad:['Used for private projects with no public audience']}
];


</script>
<script>
const EXTRA=[
 {id:'hub',t:'One Model',s:'',purpose:'The model is built once, then every stakeholder gets their own proposal from it.',
  does:['Same geometry, scene and map for every proposal','Angle, focus, video and shot list change per stakeholder','Each proposal references we\'re working across the project'],
  inp:'Model + environment.',out:'One proposal per stakeholder.',ok:['Four proposals for the cost of one model'],bad:['Proposals look like copies of each other']},
 {id:'mk1',t:'Now: Large Commercial + Public',s:'',purpose:'First market. Positioning: the team that documents America\'s biggest construction projects.',
  does:['Large commercial GCs','Public projects'],inp:'Scouting list.',out:'Primary targets.',ok:['Proposals go to every major project in the country'],bad:['Spread too thin before the large market is covered']},
 {id:'mk2',t:'Later: Smaller + Home Builders',s:'',purpose:'Same system, opened up once large projects are covered.',
  does:['Smaller builders','Individual home builders'],inp:'Scouting list.',out:'Secondary targets.',ok:['Volume once large market saturates'],bad:['Started too early, diluting positioning']}
];

// ---------- Layout (world units) ----------
const W=190,H=64, GX=250;
const P=[];  // nodes: {id,x,y,w,h,cls,label,num,kind}
const pipeCls={proposal:'or big',scouting:'pitched',dossier:'pitched',outreach:'pitched',tracking:'pitched'};
PIPE.forEach((n,i)=>P.push({id:n.id,x:i*GX,y:0,w:n.id==='proposal'?W+20:W,h:n.id==='proposal'?H+12:H,cls:pipeCls[n.id]||'',label:n.t,num:String(i+1).padStart(2,'0'),kind:'pipe',ref:n}));
// proposal frame
const FX=300,FY=230,CW=230,CG=56;
GROUPS.forEach((g,gi)=>{g.nodes.forEach((n,ri)=>{const k=GROUPS.slice(0,gi).reduce((a,x)=>a+x.nodes.length,0)+ri+1;
  P.push({id:n.id,x:FX+40+gi*(CW+CG),y:FY+70+ri*112,w:CW,h:H,cls:'or',label:n.t,num:String(k).padStart(2,'0'),kind:'phase',ref:n,group:g.name})})});
const frameW=40+4*CW+3*CG+80, frameH=70+3*112-48+40;
// stakeholders
P.push({id:'hub',x:FX+frameW/2-110,y:FY+frameH+90,w:220,h:H,cls:'',label:'One Model ? 4 Proposals',kind:'extra',ref:EXTRA[0]});
STK.forEach((n,i)=>P.push({id:n.id,x:FX+i*((frameW-200)/3),y:FY+frameH+250,w:200,h:H,cls:'',label:n.t,kind:'stk',ref:n}));
// signals + needs
const RX=FX+frameW+170, RY=FY;
['Revenue','Headcount','Existing marketing','Company type + pressures'].forEach((t,i)=>P.push({id:'sig'+i,x:RX,y:RY+70+i*90,w:210,h:58,cls:'ghost',label:t,kind:'ghost'}));
NEEDS.forEach((n,i)=>P.push({id:n.id,x:RX+300+(i%2)*240,y:RY+70+Math.floor(i/2)*112,w:210,h:H,cls:'',label:n.t,kind:'need',ref:n}));
P.push({id:'mk1',x:RX,y:RY+500,w:340,h:H,cls:'',label:'Now: Large Commercial + Public',kind:'extra',ref:EXTRA[1]});
P.push({id:'mk2',x:RX+400,y:RY+500,w:340,h:H,cls:'pitched',label:'Later: Smaller + Home Builders',kind:'extra',ref:EXTRA[2]});

const FR=[
 {id:'f-prop',x:FX,y:FY,w:frameW,h:frameH,cls:'or',label:'Proposal System ? 11 phases'},
 {id:'f-stk',x:FX-30,y:FY+frameH+210,w:frameW+60,h:H+80,cls:'',label:'Per stakeholder'},
 {id:'f-sig',x:RX-30,y:RY,w:270,h:440,cls:'',label:'Signals'},
 {id:'f-need',x:RX+270,y:RY,w:510,h:440,cls:'',label:'Client need ? sales path'},
 {id:'f-mk',x:RX-30,y:RY+470,w:810,h:H+60,cls:'',label:'Markets'}
];

// ---------- Render ----------
const world=document.getElementById('world'),svg=document.getElementById('wires');
FR.forEach(f=>{const d=document.createElement('div');d.className='frame '+f.cls;d.id=f.id;Object.assign(d.style,{left:f.x+'px',top:f.y+'px',width:f.w+'px',height:f.h+'px'});d.innerHTML=`<span class="fl">${f.label}</span>`;world.appendChild(d)});
GROUPS.forEach((g,gi)=>{const l=document.createElement('div');l.className='col-l';l.textContent=g.name;Object.assign(l.style,{left:(FX+40+gi*(CW+CG))+'px',top:(FY+36)+'px'});world.appendChild(l)});
const byId={};
P.forEach(p=>{byId[p.id]=p;const d=document.createElement('div');d.className='n '+p.cls;d.dataset.id=p.id;
  Object.assign(d.style,{left:p.x+'px',top:p.y+'px',width:p.w+'px',height:p.h+'px'});
  d.innerHTML=(p.num?`<span class="i">${p.num}</span>`:'')+`<span>${p.label}</span>`;world.appendChild(d);p.el=d});

function A(p,side){const r=byId[p]||p;switch(side){case't':return[r.x+r.w/2,r.y];case'b':return[r.x+r.w/2,r.y+r.h];case'l':return[r.x,r.y+r.h/2];default:return[r.x+r.w,r.y+r.h/2]}}
const N={t:[0,-1],b:[0,1],l:[-1,0],r:[1,0]};
function wire(a,as,b,bs,o={}){const[p1,p2]=[A(a,as),A(b,bs)];const d=Math.max(40,Math.min(160,Math.hypot(p2[0]-p1[0],p2[1]-p1[1])*.45))*(o.k||1);
  const c1=[p1[0]+N[as][0]*d,p1[1]+N[as][1]*d],c2=[p2[0]+N[bs][0]*d,p2[1]+N[bs][1]*d];
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d',`M${p1} C${c1} ${c2} ${p2}`);path.setAttribute('fill','none');
  path.setAttribute('stroke',o.or?'#FF4900':'#55555e');path.setAttribute('stroke-width',o.or?2.2:1.8);
  if(o.dash)path.setAttribute('stroke-dasharray','6 6');
  path.setAttribute('marker-end',`url(#${o.or?'aho':'ah'})`);svg.appendChild(path);
  if(o.label){const e=document.createElement('div');e.className='el';e.textContent=o.label;
    const mx=(p1[0]+3*c1[0]+3*c2[0]+p2[0])/8,my=(p1[1]+3*c1[1]+3*c2[1]+p2[1])/8;
    Object.assign(e.style,{left:mx+'px',top:my+'px',transform:'translate(-50%,-50%)'});world.appendChild(e)}}
function ortho(pts,o={}){let d=`M${pts[0]}`;const R=18;
  for(let i=1;i<pts.length-1;i++){const[a,b,c]=[pts[i-1],pts[i],pts[i+1]];
    const v1=[Math.sign(b[0]-a[0]),Math.sign(b[1]-a[1])],v2=[Math.sign(c[0]-b[0]),Math.sign(c[1]-b[1])];
    const r=Math.min(R,Math.hypot(b[0]-a[0],b[1]-a[1])/2,Math.hypot(c[0]-b[0],c[1]-b[1])/2);
    d+=` L${b[0]-v1[0]*r},${b[1]-v1[1]*r} Q${b} ${b[0]+v2[0]*r},${b[1]+v2[1]*r}`}
  d+=` L${pts.at(-1)}`;
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',d);path.setAttribute('fill','none');
  path.setAttribute('stroke',o.or?'#FF4900':'#55555e');path.setAttribute('stroke-width',o.or?2.2:1.8);if(o.dash)path.setAttribute('stroke-dasharray','6 6');
  path.setAttribute('marker-end',`url(#${o.or?'aho':'ah'})`);svg.appendChild(path);
  if(o.label){const e=document.createElement('div');e.className='el';e.textContent=o.label;const m=pts[o.at||1];
    Object.assign(e.style,{left:m[0]+'px',top:m[1]+'px',transform:'translate(-50%,-50%)'});world.appendChild(e)}}
// pipeline chain
for(let i=0;i<PIPE.length-1;i++)wire(PIPE[i].id,'r',PIPE[i+1].id,'l');
// loops (above)
wire('engagement','t','outreach','t',{dash:1,k:1.2,label:'follow-up'});
wire('sign','t','dossier','t',{dash:1,k:2.2,label:'same project'});
wire('expand','t','scouting','t',{dash:1,k:3.4,label:'same client, next project'});
// proposal internals
{const a=A('proposal','b');ortho([a,[a[0],FY]],{or:1,dash:1,label:'expands',at:0});}
wire('dossier','b','p1','t',{or:1,label:'project + contacts'});
const ph=GROUPS.flatMap(g=>g.nodes.map(n=>n.id));
GROUPS.forEach(g=>{for(let i=0;i<g.nodes.length-1;i++)wire(g.nodes[i].id,'b',g.nodes[i+1].id,'t',{or:1})});
for(let gi=0;gi<GROUPS.length-1;gi++){const a=GROUPS[gi].nodes.at(-1).id,b=GROUPS[gi+1].nodes[0].id;wire(a,'r',b,'l',{or:1})}
{const a=A('p11','r'),r=A('review','b'),lx=FX+frameW-40;ortho([a,[lx,a[1]],[lx,150],[r[0],150],r],{or:1,label:'one page per stakeholder',at:3});}
wire('p5','b','hub','t',{});
STK.forEach(s=>wire('hub','b',s.id,'t',{}));
{const a=A('p6','t');ortho([a,[a[0],FY+52],[RX-70,FY+52],[RX-70,RY+220],[RX-32,RY+220]],{label:'reads',at:2});}
wire({x:RX+240,y:RY+220,w:0,h:0},'r',{x:RX+270,y:RY+220,w:0,h:0},'l',{});
wire({x:RX+525,y:RY,w:0,h:0},'t','call','b',{label:'sets sales path'});
// size svg
let bx=0,by=0;P.concat(FR).forEach(p=>{bx=Math.max(bx,p.x+p.w);by=Math.max(by,p.y+p.h)});
svg.setAttribute('width',bx+200);svg.setAttribute('height',by+200);

// ---------- Pan / zoom ----------
const stage=document.getElementById('stage');let tx=40,ty=80,sc=1;
function apply(anim){world.classList.toggle('anim',!!anim);world.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;
  stage.style.backgroundPosition=`${tx}px ${ty}px`;stage.style.backgroundSize=`${24*sc}px ${24*sc}px`}
function zoomAt(f,cx,cy,anim){const ns=Math.min(2.2,Math.max(.12,sc*f));tx=cx-(cx-tx)*ns/sc;ty=cy-(cy-ty)*ns/sc;sc=ns;apply(anim)}
function fit(b,anim){const vw=innerWidth,vh=innerHeight,pad=innerWidth<700?18:70,top=70,bot=80;
  sc=Math.min((vw-pad*2)/b.w,(vh-top-bot)/b.h,1.3);tx=(vw-b.w*sc)/2-b.x*sc;ty=top+((vh-top-bot)-b.h*sc)/2-b.y*sc;
  if(vw<700&&sc<.5&&!b.all){sc=.5;tx=pad-b.x*sc;ty=top+((vh-top-bot)-b.h*sc)/2-b.y*sc}apply(anim)}
const ALLB={x:-40,y:-260,w:bx+80,h:by+300,all:1};
const pts=new Map();let moved=0,downT=null,last=null,pinch0=null;
stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);moved=0;downT=e.target.closest('.n');
  if(pts.size===2){const[a,b]=[...pts.values()];pinch0={d:Math.hypot(a[0]-b[0],a[1]-b[1]),s:sc}}stage.classList.add('drag')});
stage.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId),dx=e.clientX-p[0],dy=e.clientY-p[1];
  pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===2&&pinch0){const[a,b]=[...pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);const cx=(a[0]+b[0])/2,cy=(a[1]+b[1])/2;
    zoomAt((pinch0.s*d/pinch0.d)/sc,cx,cy);moved=99;return}
  moved+=Math.abs(dx)+Math.abs(dy);tx+=dx;ty+=dy;apply()});
function up(e){pts.delete(e.pointerId);if(pts.size<2)pinch0=null;if(!pts.size){stage.classList.remove('drag');if(moved<8&&downT&&byId[downT.dataset.id].ref)open(downT.dataset.id)}}
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey||e.metaKey||Math.abs(e.deltaY)>40&&!e.deltaX)zoomAt(Math.exp(-e.deltaY*.0025),e.clientX,e.clientY);else{tx-=e.deltaX;ty-=e.deltaY;apply()}},{passive:false});
document.getElementById('zin').onclick=()=>zoomAt(1.25,innerWidth/2,innerHeight/2,1);
document.getElementById('zout').onclick=()=>zoomAt(.8,innerWidth/2,innerHeight/2,1);
document.getElementById('zfit').onclick=()=>fit(ALLB,1);

// ---------- Jump chips ----------
const VIEWS=[
 ['Everything',ALLB],
 ['Pipeline',{x:-20,y:-240,w:PIPE.length*GX,h:330}],
 ['Proposal System',{x:FX-20,y:FY-20,w:frameW+40,h:frameH+40}],
 ['Stakeholders',{x:FX-40,y:FY+frameH+60,w:frameW+80,h:300}],
 ['Client Paths',{x:RX-40,y:RY-20,w:830,h:620}]
];
const chips=document.getElementById('chips');
VIEWS.forEach(([l,b],i)=>{const btn=document.createElement('button');btn.textContent=l;btn.onclick=()=>{fit(b,1);[...chips.children].forEach(c=>c.classList.remove('on'));btn.classList.add('on')};chips.appendChild(btn)});

// ---------- Sheet ----------
const sheet=document.getElementById('sheet');let cur=null;
const ORDER=P.filter(p=>p.ref).map(p=>p.id);
function L(a){return '<ul>'+a.map(x=>`<li>${x}</li>`).join('')+'</ul>'}
function open(id){const p=byId[id],n=p.ref;cur=id;
  const or=p.cls.includes('or');const kk=document.getElementById('sk');
  kk.className='k'+(or?' or':'');
  kk.textContent=p.kind==='phase'?`Phase ${p.num} · ${p.group}`:p.kind==='pipe'?`Stage ${p.num}${n.tag?' · '+n.tag:''}`:p.kind==='stk'?'Stakeholder proposal':p.kind==='need'?'Client need':'';
  document.getElementById('st').textContent=n.t;
  document.getElementById('sb').innerHTML=`<div class="sec"><p>${n.purpose}</p></div>
   <div class="sec"><div class="k">Does</div>${L(n.does)}</div>
   <div class="sec"><div class="io"><div><b>In</b>${n.inp}</div><div><b>Out</b>${n.out}</div></div></div>
   <div class="sec ok"><div class="k">Wins when</div>${L(n.ok)}</div>
   <div class="sec bad"><div class="k">Fails when</div>${L(n.bad)}</div>`;
  document.getElementById('sb').scrollTop=0;
  P.forEach(q=>q.el.classList.toggle('sel',q.id===id));
  const i=ORDER.indexOf(id);document.getElementById('sp').disabled=i<=0;document.getElementById('sn').disabled=i>=ORDER.length-1;
  sheet.classList.add('on');
  // keep node visible
  const vw=innerWidth,vh=innerHeight,mob=vw<700;const cx=(p.x+p.w/2)*sc+tx,cy=(p.y+p.h/2)*sc+ty;
  const tgtX=mob?vw/2:(vw-420)/2,tgtY=mob?vh*.16:vh/2;
  if(mob?cy>vh*.26||cy<60||cx<20||cx>vw-20:cx>vw-440||cx<20||cy<60||cy>vh-80){tx+=tgtX-cx;ty+=tgtY-cy;apply(1)}}
function close(){sheet.classList.remove('on');P.forEach(q=>q.el.classList.remove('sel'));cur=null}
document.getElementById('sx').onclick=close;
document.getElementById('sp').onclick=()=>{const i=ORDER.indexOf(cur);if(i>0)open(ORDER[i-1])};
document.getElementById('sn').onclick=()=>{const i=ORDER.indexOf(cur);if(i<ORDER.length-1)open(ORDER[i+1])};
addEventListener('keydown',e=>{if(e.key==='Escape')close()});
sheet.addEventListener('pointerdown',e=>e.stopPropagation());

// start
if(innerWidth<700){fit(VIEWS[1][1]);chips.children[1].classList.add('on')}else{fit(ALLB);chips.children[0].classList.add('on')}

</script>
</body>
